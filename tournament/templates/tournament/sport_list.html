{% extends 'tournament/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Sports</h2>
        <a href="{% url 'sport_create' %}" class="btn btn-primary">Add Sport</a>
    </div>

    {% if sports %}
    <ul class="list-group">
        {% for sport in sports %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ sport.name }}
            <span>
                <a href="{% url 'sport_update' sport.id %}" class="btn btn-sm btn-warning me-2">Edit</a>
                <a href="{% url 'sport_delete' sport.id %}" class="btn btn-sm btn-danger">Delete</a>
            </span>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="text-muted">No sports available.</p>
    {% endif %}
</div>
{% endblock %}
