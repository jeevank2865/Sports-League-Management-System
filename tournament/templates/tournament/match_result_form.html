{% extends 'tournament/base.html' %}
{% load static %}

{% block content %}

<style>
.match-page {
    min-height: 100vh;
    padding: 40px 0;
    background: radial-gradient(circle at top left, rgba(96,165,250,.14), transparent 55%),
                radial-gradient(circle at bottom right, rgba(147,51,234,.12), transparent 55%),
                #f5f7fb;
    display: flex;
    justify-content: center;
}

.match-card {
    width: 100%;
    max-width: 520px;
    border-radius: 22px;
    background: rgba(255,255,255,.93);
    border: 1px solid rgba(226,232,240,0.9);
    padding: 28px;
    backdrop-filter: blur(9px);
    box-shadow: 0 18px 36px rgba(15,23,42,.18);
    animation: fadeUp .5s ease-out;
}

@keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
}

.match-title {
    font-size: 26px;
    font-weight: 700;
    color: #0f172a;
    text-align: center;
}

.match-sub {
    color:#64748b;
    font-size: 15px;
    text-align:center;
    margin-bottom: 20px;
}

.form-label {
    font-weight: 600;
    color: #334155;
}

.form-control {
    border-radius: 12px !important;
    padding: 10px 14px !important;
    border: 1px solid #cbd5e1 !important;
}

.form-control:focus {
    border-color: #6366f1 !important;
    box-shadow: 0 0 0 4px rgba(99,102,241,.15) !important;
}

.btn-submit {
    background: linear-gradient(135deg,#22c55e,#16a34a);
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:14px;
    font-weight:600;
    transition:.25s;
}
.btn-submit:hover {
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(22,163,74,.35);
}

.btn-cancel {
    border-radius:14px;
    font-weight:600;
    padding:10px 20px;
}
</style>


<div class="match-page">

    <div class="match-card">

        <h2 class="match-title mb-2">Update Match Result</h2>

        <p class="match-sub">
            {{ match.team1.name }} <strong>vs</strong> {{ match.team2.name }}
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Winner</label>
                {{ form.winner }}
            </div>

            <div class="mb-3">
                <label class="form-label">{{ match.team1.name }} Score</label>
                {{ form.team1_score }}
            </div>

            <div class="mb-3">
                <label class="form-label">{{ match.team2.name }} Score</label>
                {{ form.team2_score }}
            </div>

            <div class="mb-3">
                <label class="form-label">Player of the Match</label>
                {{ form.POM }}
            </div>

            <div class="mb-3">
                <label class="form-label">Status</label>
                {{ form.status }}
            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-submit">Update Result</button>
                <a href="{% url 'match_list' %}" class="btn btn-secondary btn-cancel ms-2">Cancel</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
