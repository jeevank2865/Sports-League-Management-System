{% extends 'tournament/base.html' %}
{% load static %}

{% block content %}

<style>
.delete-page {
    min-height: 100vh;
    padding: 40px 0;
    background: radial-gradient(circle at top left, rgba(248,113,113,.15), transparent 55%),
                radial-gradient(circle at bottom right, rgba(239,68,68,.12), transparent 55%),
                #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
}

.delete-card {
    width: 100%;
    max-width: 500px;
    border-radius: 22px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(226,232,240,.85);
    backdrop-filter: blur(10px);
    padding: 28px 25px;
    box-shadow: 0 18px 38px rgba(15,23,42,.18);
    animation: fadeUp .45s ease-out;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to   { opacity: 1; transform: translateY(0); }
}

.delete-header {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    padding: 16px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 24px rgba(220,38,38,.35);
}

.delete-title {
    font-size: 24px;
    font-weight: 700;
}

.delete-btn {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: white;
    border: none;
    padding: 10px 22px;
    font-weight: 600;
    border-radius: 12px;
    transition: all .25s;
}
.delete-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 24px rgba(185,28,28,.35);
}

.cancel-btn {
    border-radius: 12px;
    padding: 10px 22px;
    font-weight: 600;
}
</style>


<div class="delete-page">

    <div class="delete-card">

        <div class="delete-header">
            <h4 class="delete-title">Confirm Delete</h4>
        </div>

        <p class="text-center fs-5 mb-4">
            Are you sure you want to delete this match?
        </p>

        <form method="post" class="text-center">
            {% csrf_token %}
            <button type="submit" class="delete-btn">Yes, Delete</button>
            <a href="{% url 'match_list' %}" class="btn btn-secondary cancel-btn ms-2">Cancel</a>
        </form>

    </div>

</div>

{% endblock %}
