{% extends 'tournament/base.html' %}
{% load static %}

{% block content %}

<style>
/* Background */
.signup-page {
    min-height: 100vh;
    padding: 40px 0;
    background: radial-gradient(circle at top left, rgba(96,165,250,0.13), transparent 60%),
                radial-gradient(circle at bottom right, rgba(167,139,250,0.12), transparent 60%),
                #f5f7fb;
    position: relative;
    overflow: hidden;
}

.signup-bubble {
    position:absolute;
    border-radius:999px;
    filter:blur(60px);
    opacity:.75;
    pointer-events:none;
}
.signup-bubble.blue { top:-120px; right:-120px; width:340px; height:340px; background:rgba(59,130,246,.25); }
.signup-bubble.purple { bottom:-120px; left:-120px; width:340px; height:340px; background:rgba(139,92,246,.25); }

/* Card */
.signup-card {
    border-radius:26px;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(10px);
    border:1px solid rgba(226,232,240,0.9);
    box-shadow:0 20px 40px rgba(15,23,42,0.18);
    overflow:hidden;
}

/* Icon */
.signup-icon {
    width:70px;height:70px;border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:#fff;
    margin:auto;margin-top:-35px;
    box-shadow:0 20px 40px rgba(37,99,235,0.35);
}

/* Button */
.btn-signup {
    background:linear-gradient(135deg,#3b82f6,#7c3aed);
    border:none;
    color:white;
    border-radius:50px;
    padding:10px;
    font-weight:600;
    transition:.2s;
}
.btn-signup:hover {
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(59,130,246,.35);
}
</style>


<div class="signup-page">
    <div class="signup-bubble blue"></div>
    <div class="signup-bubble purple"></div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="signup-card p-4 mt-5 position-relative">

                    <!-- Icon -->
                    <div class="signup-icon">📝</div>

                    <!-- Heading -->
                    <h3 class="text-center fw-bold mt-3">Guest Signup</h3>
                    <p class="text-center text-muted mb-4">Register to explore tournaments and view team data.</p>

                    <!-- Form -->
                    <form method="post" class="mt-3">
                        {% csrf_token %}

                        {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-signup">Sign Up</button>
                        </div>

                    </form>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
